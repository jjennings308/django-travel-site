# Monthly dependency updates (site roadmap R23): one grouped pull request for the Python pins and one for
# the GitHub Actions versions. CI runs on each PR; merge or close it. Security updates arrive as soon
# as they're published, whatever the schedule. CDN scripts in templates aren't covered (they're pinned
# with SRI; update them by hand).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
