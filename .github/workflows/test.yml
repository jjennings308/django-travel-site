# Checks and the full test suite on every push to main (site roadmap R12) and on pull requests into it
# (R23: Dependabot's monthly update PRs are tested before they're merged). Branch pushes don't run it.
# A failing run emails whoever pushed. Same steps as "Before finishing a task" in CLAUDE.md.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: travel_site
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: travel_site
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travel_site" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: travel_site
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: travel_site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: System libraries (WeasyPrint for the PDF booklet)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: Python packages
        run: pip install -r requirements-dev.txt

      - name: Known vulnerabilities in requirements.txt (pip-audit)
        # Fails on any known vulnerability (R23). One that can't be fixed yet goes in .pip-audit-ignore.
        run: |
          pip install pip-audit==2.10.1
          ignores=$(grep -oE '^[A-Za-z0-9-]+' .pip-audit-ignore | sed 's/^/--ignore-vuln /' | tr '\n' ' ' || true)
          pip-audit -r requirements.txt --progress-spinner off $ignores

      - name: Layer check
        run: python scripts/check_layers.py

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Production settings pass check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-not-a-secret-but-long-enough-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: example.com
          EMAIL_HOST: localhost
        run: python manage.py check --deploy --fail-level WARNING

      - name: Tests
        run: python manage.py test --parallel --noinput

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: theme/static_src/package-lock.json

      - name: Built CSS matches the templates
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          npm ci --prefix theme/static_src
          python manage.py tailwind build
          git diff --exit-code -- theme/static/css/dist/styles.css || {
            echo "::error::theme/static/css/dist/styles.css is out of date: run 'python manage.py tailwind build' and commit it."
            exit 1
          }
