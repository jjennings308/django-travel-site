{# activities/partials/_confirm.html — a POST confirmation card. Pass heading, message, button, tone ("danger" or "primary"), icon. #}
<div class="mx-auto max-w-xl">
  <div class="sbl-card p-6 text-center">
    <div class="mx-auto mb-4 flex size-14 items-center justify-center rounded-full text-2xl {% if tone == 'danger' %}bg-red-100 text-red-700{% else %}bg-earth-sand text-earth-clay{% endif %}"><i class="bi {{ icon }}"></i></div>
    <h1 class="mb-2 text-2xl font-bold text-warm-900">{{ heading }}</h1>
    <p class="mb-1 text-lg font-semibold text-warm-800">“{{ activity.name }}”</p>
    <p class="mb-6 text-warm-600">{{ message }}</p>
    <form method="post" class="flex justify-center gap-2">
      {% csrf_token %}
      <a href="{% url 'activities:activity_detail' activity.slug %}" class="sbl-btn sbl-btn-outline">Cancel</a>
      <button type="submit" class="sbl-btn {% if tone == 'danger' %}sbl-btn-danger{% else %}sbl-btn-primary{% endif %}">{{ button }}</button>
    </form>
  </div>
</div>
