<!-- templates/accounts/resend_verification.html -->
{% extends 'base.html' %}

{% block title %}Resend Verification Email{% endblock %}

{% block content %}
<div class="mt-12">
    <div class="grid grid-cols-12 justify-center">
        <div class="col-span-12 md:col-span-6">
            <div class="sbl-card">
                <div class="border-b border-warm-200 px-5 py-3 font-semibold">
                    <h3>Resend Verification Email</h3>
                </div>
                <div class="p-5">
                    <p>Enter your email address and we'll send you a new verification link.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="email" class="sbl-label">Email Address</label>
                            <input type="email" name="email" class="sbl-input" required>
                        </div>
                        <button type="submit" class="sbl-btn sbl-btn-primary">Resend Verification Email</button>
                    </form>
                    
                    <div class="mt-4">
                        <a href="{% url 'login' %}">← Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
