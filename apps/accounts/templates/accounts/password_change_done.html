<!-- templates/accounts/password_change_done.html -->
{% extends 'base.html' %}

{% block title %}Password Changed{% endblock %}

{% block content %}
<div class="mt-12">
    <div class="grid grid-cols-12 justify-center">
        <div class="col-span-12 md:col-span-6 text-center">
            <div class="sbl-card">
                <div class="p-5">
                    <h2>Password Changed</h2>
                    <p class="text-lg text-warm-700 mt-4">Your password has been updated.</p>
                    <a href="{% url 'settings' %}" class="sbl-btn sbl-btn-primary">Back to Settings</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
