<!-- templates/accounts/password_reset.html -->
{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="mt-12">
    <div class="mx-auto w-full max-w-xl">
        <div>
            <div class="sbl-card">
                <div class="border-b border-warm-200 px-5 py-3 font-semibold">
                    <h3>Reset Password</h3>
                </div>
                <div class="p-5">
                    <p>Enter your email address and we'll send you instructions to reset your password.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            {{ form.email }}
                        </div>
                        <button type="submit" class="sbl-btn sbl-btn-primary">Send Reset Link</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
