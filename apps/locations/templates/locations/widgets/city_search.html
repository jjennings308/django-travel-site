{% load static %}{# The city search box (widgets.CitySearchInput / CitySearchMultiple; locations/city_search.js). #}
{{ widget.search.config|json_script:widget.search.config_id }}
<div class="city-search relative" x-data="citySearch('{{ widget.search.config_id }}')" x-cloak @click.outside="open = false" @keydown.escape="open = false" data-city-search>
  <input type="hidden" x-bind:name="multiple ? null : name" x-bind:value="value" x-bind:data-tz="timezone" x-ref="value">
  <template x-if="multiple"><div><template x-for="city in selected" :key="city.id"><input type="hidden" :name="name" :value="city.id"></template></div></template>
  <div class="mb-1 flex flex-wrap gap-1" x-show="multiple && selected.length">
    <template x-for="city in selected" :key="city.id">
      <span class="chip inline-flex items-center gap-1 rounded-full border border-zinc-300 bg-zinc-50 px-2 py-0.5 text-sm"><span x-text="city.label"></span><button type="button" class="text-zinc-500 hover:text-red-700" @click="remove(city)" :aria-label="'Remove ' + city.label">×</button></span>
    </template>
  </div>
  <p class="mb-1 flex flex-wrap items-center gap-2 text-sm" x-show="!multiple && selected.length">
    <span class="font-medium" x-text="selected.length ? selected[0].label : ''"></span>
    <button type="button" class="link-quiet text-xs" @click="clear()">Clear</button>
  </p>
  <input type="text" id="{{ widget.attrs.id }}" class="{{ widget.search.text_class }}" autocomplete="off" placeholder="{{ widget.search.placeholder }}"
         x-model="q" @input.debounce.250ms="search()" @focus="open = true" @keydown.down.prevent="move(1)" @keydown.up.prevent="move(-1)" @keydown.enter.prevent="choose()"
         role="combobox" :aria-expanded="open" aria-autocomplete="list" data-city-search-input>
  <div class="absolute left-0 right-0 z-30 mt-1 max-h-72 overflow-y-auto rounded-lg border border-zinc-200 bg-white p-1 text-sm shadow-lg" x-show="open && (results.length || (chips.length && !q.trim()) || q.trim().length >= 2) && !adding" role="listbox">
    <template x-if="!q.trim() && chips.length">
      <div class="flex flex-wrap gap-1 p-1"><span class="card-kicker w-full">This trip</span>
        <template x-for="city in chips" :key="city.id"><button type="button" class="chip rounded-full border border-zinc-300 px-2 py-0.5" @click="pick(city)" x-text="city.label"></button></template>
      </div>
    </template>
    <template x-for="(city, i) in results" :key="city.id">
      <button type="button" class="block w-full rounded px-2 py-1.5 text-left hover:bg-zinc-100" :class="i === active && 'bg-zinc-100'" @click="pick(city)" role="option">
        <span class="fi" :class="city.flag && 'fi-' + city.flag" aria-hidden="true"></span> <span class="font-medium" x-text="city.name"></span><span class="text-zinc-500" x-text="[city.region, city.country].filter(Boolean).join(', ') ? ' · ' + [city.region, city.country].filter(Boolean).join(', ') : ''"></span>
        <span class="text-xs text-amber-700" x-show="city.pending"> · awaiting review</span>
      </button>
    </template>
    <p class="px-2 py-1.5 text-zinc-500" x-show="busy">Searching…</p>
    <button type="button" class="block w-full rounded px-2 py-1.5 text-left font-medium hover:bg-zinc-100" x-show="q.trim().length >= 2 && !busy" @click="startNew()" data-city-new>Add “<span x-text="q.trim()"></span>” as a new city</button>
  </div>
  <div class="mt-2 rounded-lg border border-zinc-200 p-3 text-sm" x-show="adding" data-city-new-form>
    <p class="card-kicker mb-2">A new city</p>
    <label class="mb-2 block">Name <input type="text" class="{{ widget.search.text_class }}" x-model="draft.name"></label>
    <label class="mb-2 block">Country
      <select class="{{ widget.search.text_class }}" x-model="draft.country" @change="loadRegions()"><option value="">---------</option><template x-for="c in countries" :key="c.id"><option :value="c.id" x-text="c.name"></option></template></select>
    </label>
    <label class="mb-2 block" x-show="regions.length">Region (optional)
      <select class="{{ widget.search.text_class }}" x-model="draft.region"><option value="">---------</option><template x-for="r in regions" :key="r.id"><option :value="r.id" x-text="r.name"></option></template></select>
    </label>
    <p class="mb-2 text-red-700" x-show="error" x-text="error"></p>
    <p class="mb-2 text-xs text-zinc-500">You can use it straight away; staff review it before others see it.</p>
    <div class="flex gap-2"><button type="button" class="btn" @click="saveNew()" :disabled="busy">Add the city</button><button type="button" class="btn-quiet" @click="adding = false">Cancel</button></div>
  </div>
</div>
<noscript>
  <select name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" with widget=widget.search.fallback %}>{% for group_name, group_choices, group_index in widget.optgroups %}{% if group_name %}<optgroup label="{{ group_name }}">{% endif %}{% for option in group_choices %}{% include option.template_name with widget=option %}{% endfor %}{% if group_name %}</optgroup>{% endif %}{% endfor %}</select>
  <a class="link-quiet text-xs" href="{% url 'locations:city_new' %}">City not listed? Add it</a>
</noscript>
<script src="{% static 'locations/city_search.js' %}"></script>
