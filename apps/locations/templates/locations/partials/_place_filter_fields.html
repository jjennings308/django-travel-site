{# locations/partials/_place_filter_fields.html — Search, Country and Type for the Places list and map (views._place_filters); fields of the filter bar (ux-consistency V2) #}
<div><label for="filter_q" class="sbl-label">Search</label>
  <input type="text" id="filter_q" name="q" value="{{ search_query }}" placeholder="Search places…" class="sbl-input"></div>
<div><label for="filter_country" class="sbl-label">Country</label>
  <select id="filter_country" name="country" class="sbl-input">
    <option value="">All countries</option>
    {% for country in countries %}<option value="{{ country.id }}" {% if selected_country == country.id|stringformat:"s" %}selected{% endif %}>{{ country.flag_emoji }} {{ country.name }}</option>{% endfor %}
  </select></div>
<div><label for="filter_type" class="sbl-label">Type</label>
  <select id="filter_type" name="type" class="sbl-input">
    <option value="">All types</option>
    {% for value, label in poi_types %}<option value="{{ value }}" {% if selected_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select></div>
