# nginx site for staging.sharebucketlist.com (site roadmap R16): /etc/nginx/sites-available/staging.sharebucketlist.com
# The whole site is behind basic auth (it holds a disguised copy of real trips) and is never indexed.
# After installing: sudo certbot --nginx -d staging.sharebucketlist.com  (adds the TLS lines and the
# port-80 redirect), then sudo nginx -t && sudo systemctl reload nginx.
server {
    server_name staging.sharebucketlist.com;
    client_max_body_size 25m;

    auth_basic "ShareBucketList staging";
    auth_basic_user_file /etc/nginx/staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /static/ {
        alias /var/www/travel_site_staging/staticfiles/;
        expires 1h;
        access_log off;
    }

    location /media/ {
        alias /var/www/travel_site_staging/uploads/;
    }

    location / {
        proxy_pass http://unix:/run/travel_site_staging/travel_site_staging.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    listen 80;
}
