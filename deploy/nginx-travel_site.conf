# nginx site for ShareBucketList (travel_site). Copy to /etc/nginx/sites-available/,
# set server_name and the certificate paths, symlink into sites-enabled, then
# `sudo nginx -t && sudo systemctl reload nginx`. Certificates: certbot --nginx.

server {
    listen 80;
    server_name staging.sharebucketlist.com;          # <- your staging host
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.sharebucketlist.com;          # <- your staging host

    ssl_certificate     /etc/letsencrypt/live/staging.sharebucketlist.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.sharebucketlist.com/privkey.pem;

    client_max_body_size 25m;                         # media / document uploads

    # collectstatic output (committed in the repo; re-run after pulling)
    location /static/ {
        alias /var/www/travel_site/staticfiles/;
        expires 7d;
        access_log off;
    }

    # User uploads (MEDIA_ROOT). Django serves these only when DEBUG is on.
    location /media/ {
        alias /var/www/travel_site/uploads/;
    }

    location / {
        proxy_pass http://unix:/run/travel_site/travel_site.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Must overwrite, never pass through: prod.py trusts this header for HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
