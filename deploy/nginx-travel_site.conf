# nginx site for ShareBucketList, as running on the live server
# (/etc/nginx/sites-available/sharebucketlist.com). For another host: change
# server_name, run `sudo certbot --nginx -d <host>` (it adds the TLS lines and the
# port-80 redirect marked "managed by Certbot"), then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Private uploads (role-request documents) live in /var/www/travel_site/private_uploads/,
# outside the /media/ alias, so nginx never serves them; Django checks access.
server {
    server_name sharebucketlist.com www.sharebucketlist.com;
    client_max_body_size 25m;                         # picture / document uploads (app limit 20 MB)

    # collectstatic output (hashed names; built on the server by deploy.sh)
    location /static/ {
        alias /var/www/travel_site/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Public user uploads (MEDIA_ROOT).
    location /media/ {
        alias /var/www/travel_site/uploads/;
    }

    location / {
        # One canonical host: www -> https://sharebucketlist.com
        if ($host = www.sharebucketlist.com) {
            return 301 https://sharebucketlist.com$request_uri;
        }
        proxy_pass http://unix:/run/travel_site/travel_site.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Overwrite, never pass through: Django trusts this header for HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sharebucketlist.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sharebucketlist.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.sharebucketlist.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = sharebucketlist.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name sharebucketlist.com www.sharebucketlist.com;
    return 404; # managed by Certbot
}
